name: Build ImmortalWrt (SDK + ImageBuilder)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "타겟 (예: mediatek, sunxi)"
        required: true
        default: "mediatek"
      subtarget:
        description: "서브타겟 (예: filogic, cortexa53)"
        required: true
        default: "filogic"
      profile:
        description: "프로필 (예: asus_tuf-ax4200q, xunlong_orangepi-zero3)"
        required: true
        default: "asus_tuf-ax4200q"
      branch:
        description: "추적할 마이너 릴리스 브랜치 (예: 24.10) - 이 안에서 최신 패치버전을 자동 탐색"
        required: true
        default: "24.10"
      version_pin:
        description: "특정 버전 강제 고정 (예: 24.10.5). 비워두면 branch 내 최신 자동 선택"
        required: false
        default: ""
      hostname:
        description: "장치 호스트네임"
        required: true
        default: "ASUS_VPNBOX"
      timezone:
        description: "타임존 (zonename)"
        required: true
        default: "Asia/Shanghai"
      luci_lang:
        description: "LuCI 기본 언어"
        required: true
        default: "ko"

permissions:
  contents: write

env:
  TARGET: ${{ inputs.target }}
  SUBTARGET: ${{ inputs.subtarget }}
  PROFILE: ${{ inputs.profile }}
  BRANCH: ${{ inputs.branch }}
  VERSION_PIN: ${{ inputs.version_pin }}
  DEVICE_HOSTNAME: ${{ inputs.hostname }}
  DEVICE_TZ: ${{ inputs.timezone }}
  LUCI_LANG: ${{ inputs.luci_lang }}
  THEME_REPO: https://github.com/derisamedia/luci-theme-alpha
  THEME_PKG: luci-theme-alpha
  THEME_CONFIG_REPO: https://github.com/animegasan/luci-app-alpha-config
  THEME_CONFIG_PKG: luci-app-alpha-config
  BRAND_URL: https://raw.githubusercontent.com/hckwon767/tuf4200q/refs/heads/main/brand.png
  NIKKI_PAGES: https://nikkinikki.pages.dev
  NIKKI_REPO: https://github.com/nikkinikki-org/OpenWrt-nikki.git
  NIKKI_LUCI_PKG: luci-app-nikki
  DASHBOARD_KO_URL: https://github.com/hckwon767/dashboard-ko/releases/latest/download/zashboard-ko.zip
  DASHBOARD_KO_LABEL: "Zashboard (한국어)"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 호스트 빌드 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd ccache

      # ---------------------------------------------------------------
      # 1) branch 내 최신 릴리스 버전 자동 탐색 (또는 version_pin 사용)
      # ---------------------------------------------------------------
      - name: 최신 릴리스 버전 및 SDK/ImageBuilder 파일명 자동 탐색
        id: resolve
        run: |
          set -euo pipefail

          if [ -n "${VERSION_PIN}" ]; then
            VERSION="${VERSION_PIN}"
            echo "버전 강제 고정: ${VERSION}"
          else
            INDEX_HTML=$(curl -fsSL "https://downloads.immortalwrt.org/releases/")
            VERSION=$(echo "${INDEX_HTML}" \
              | grep -oE "href=\"${BRANCH}\.[0-9]+/\"" \
              | sed -E 's/href="(.*)\/"/\1/' \
              | sort -V | tail -n1)
            if [ -z "${VERSION}" ]; then
              echo "::error::${BRANCH} 브랜치에서 릴리스 버전을 찾지 못했습니다."
              exit 1
            fi
            echo "자동 선택된 최신 버전: ${VERSION}"
          fi

          DOWNLOAD_BASE="https://downloads.immortalwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}"
          PAGE=$(curl -fsSL "${DOWNLOAD_BASE}/")

          IB_FILE=$(echo "${PAGE}" | grep -oE "immortalwrt-imagebuilder-[^\"]+\.tar\.zst" | head -n1)
          SDK_FILE=$(echo "${PAGE}" | grep -oE "immortalwrt-sdk-[^\"]+\.tar\.zst" | head -n1)

          if [ -z "${IB_FILE}" ] || [ -z "${SDK_FILE}" ]; then
            echo "::error::${TARGET}/${SUBTARGET} 용 ImageBuilder/SDK 파일을 ${VERSION}에서 찾지 못했습니다."
            echo "${PAGE}"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "download_base=${DOWNLOAD_BASE}" >> "$GITHUB_OUTPUT"
          echo "ib_file=${IB_FILE}" >> "$GITHUB_OUTPUT"
          echo "sdk_file=${SDK_FILE}" >> "$GITHUB_OUTPUT"
          echo "ib_url=${DOWNLOAD_BASE}/${IB_FILE}" >> "$GITHUB_OUTPUT"
          echo "sdk_url=${DOWNLOAD_BASE}/${SDK_FILE}" >> "$GITHUB_OUTPUT"

      - name: 다운로드 캐시
        uses: actions/cache@v4
        with:
          path: |
            sdk.tar.zst
            imagebuilder.tar.zst
          key: immortalwrt-${{ steps.resolve.outputs.version }}-${{ env.TARGET }}-${{ env.SUBTARGET }}

      # ccache: 동일/유사 소스 재컴파일 시 컴파일러 호출 결과를 재사용해 빌드 시간을 크게 줄인다.
      # 캐시 키를 run_id로 항상 새로 만들고 restore-keys로 직전 캐시를 이어받는 방식이라
      # 캐시가 무한정 부풀지 않으면서도(오래된 run의 캐시는 GitHub가 정리) 항상 최신 결과를 저장한다.
      - name: ccache 캐시
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.TARGET }}-${{ env.SUBTARGET }}-

      # 패키지 소스 아카이브(dl/) 캐시: feeds/패키지 컴파일 시 매번 새로 받는
      # 업스트림 소스 tarball을 재사용한다. 버전이 바뀌어도 대부분의 소스는
      # 그대로이므로 restore-keys로 이전 버전 캐시를 이어받는다.
      - name: 패키지 소스(dl) 캐시
        uses: actions/cache@v4
        with:
          path: sdk/dl
          key: dl-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ steps.resolve.outputs.version }}
          restore-keys: |
            dl-${{ env.TARGET }}-${{ env.SUBTARGET }}-

      - name: ccache 환경 설정
        run: |
          mkdir -p ~/.ccache
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          # 컴파일 커맨드가 매번 미묘하게 달라지는 상황(타임스탬프 등)에서도
          # 캐시 적중률을 높이기 위한 완화 옵션
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines" >> "$GITHUB_ENV"
          ccache -M 5G
          ccache -z

      # ---------------------------------------------------------------
      # 2) SDK 단계: luci-theme-alpha 컴파일 (brand.png 교체 포함) +
      #    luci-app-nikki 컴파일 (한국어 대시보드 프리셋 패치 포함)
      #    nikki 코어(mihomo, Rust)는 자체 opkg 피드(nikkinikki.pages.dev)를
      #    그대로 쓰고, luci-app-nikki는 Lua/JS라 가벼우므로 SDK에서 직접
      #    소스를 패치해서 컴파일한다.
      # ---------------------------------------------------------------
      - name: SDK 다운로드 및 압축 해제
        run: |
          set -euo pipefail
          [ -f sdk.tar.zst ] || curl -fsSL -o sdk.tar.zst "${{ steps.resolve.outputs.sdk_url }}"
          mkdir -p sdk
          tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1
          # ImageBuilder tarball에는 이 스크립트가 없으므로 SDK에서 미리 복사해둔다
          cp sdk/scripts/ipkg-make-index.sh ./ipkg-make-index.sh
          chmod +x ./ipkg-make-index.sh

          # ipkg-make-index.sh는 원래 build system이 만들어주는 host/mkhash 툴을
          # $MKHASH 환경변수로 넘겨 받아 "$MKHASH sha256 <file>" 형태로 호출한다.
          # SDK 단독 실행 시엔 이 값이 없으므로 sha256sum을 감싼 래퍼로 대체한다.
          cat > ./mkhash <<'MKHASH_EOF'
          #!/bin/sh
          algo="$1"; shift
          case "$algo" in
            sha256) sha256sum "$1" | cut -d' ' -f1 ;;
            md5) md5sum "$1" | cut -d' ' -f1 ;;
            *) echo "mkhash: unsupported algo $algo" >&2; exit 1 ;;
          esac
          MKHASH_EOF
          chmod +x ./mkhash
          echo "MKHASH=$(pwd)/mkhash" >> "$GITHUB_ENV"

      - name: luci-theme-alpha 소스 가져오기 + brand.png 교체
        run: |
          set -euo pipefail
          rm -rf "sdk/package/${THEME_PKG}"
          git clone --depth 1 "${THEME_REPO}" "sdk/package/${THEME_PKG}"

          curl -L --retry 3 --fail "${BRAND_URL}" -o /tmp/brand.png

          # brand.png가 실제 위치할 수 있는 모든 경로에 적용 (테마 버전에 따라 경로가 다를 수 있음)
          cp -f /tmp/brand.png "sdk/package/${THEME_PKG}/luasrc/brand.png" || true
          cp -f /tmp/brand.png "sdk/package/${THEME_PKG}/luasrc/style/brand.png" || true
          find "sdk/package/${THEME_PKG}" -type f -iname "brand.png" -exec cp -f /tmp/brand.png {} \;

      - name: luci-app-alpha-config 소스 가져오기 (테마 필수 의존 패키지)
        run: |
          set -euo pipefail
          # luci-theme-alpha는 luci-app-alpha-config가 없으면 설치가 거부된다.
          # 공식 opkg 피드에는 없으므로 같은 방식으로 SDK에서 같이 빌드한다.
          rm -rf "sdk/package/${THEME_CONFIG_PKG}"
          git clone --depth 1 "${THEME_CONFIG_REPO}" "sdk/package/${THEME_CONFIG_PKG}"

      - name: nikki 피드 등록
        run: |
          set -euo pipefail
          # luci-app-nikki 소스를 받기 위해 SDK feeds.conf.default에 등록
          # (nikki 코어 자체는 컴파일하지 않고 nikkinikki.pages.dev 프리빌트 피드를 그대로 사용)
          echo "src-git nikki ${NIKKI_REPO};main" >> sdk/feeds.conf.default
          cat sdk/feeds.conf.default

      - name: SDK feeds 업데이트/설치 및 테마+nikki UI 패키지 컴파일
        run: |
          set -euo pipefail
          cd sdk
          ./scripts/feeds update -a 2>&1 | tee ../feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee ../feeds-install.log
          ./scripts/feeds list -s > ../feeds-list.log || true

          # --- luci-app-nikki의 대시보드 프리셋을 한국어판 하나로 교체 ---
          MIXIN_JS=$(find feeds package -type f -path "*${NIKKI_LUCI_PKG}*/mixin.js" | head -n1)
          if [ -z "${MIXIN_JS}" ]; then
            echo "::error::${NIKKI_LUCI_PKG}의 mixin.js를 찾지 못했습니다. 피드 구조가 바뀌었을 수 있습니다."
            exit 1
          fi
          echo "패치 대상: ${MIXIN_JS}"
          python3 - "${MIXIN_JS}" "${DASHBOARD_KO_URL}" "${DASHBOARD_KO_LABEL}" <<'PYEOF'
          import re
          import sys

          path, url, label = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          # 1) 기존 대시보드 프리셋(Zephyruso/zashboard, MetaCubeX 계열) 줄 제거
          markers = (
              "Zephyruso/zashboard",
              "MetaCubeX/metacubexd",
              "MetaCubeX/Yacd-meta",
              "MetaCubeX/Razord-meta",
          )
          removed = 0
          kept = []
          for line in lines:
              if any(m in line for m in markers):
                  removed += 1
                  continue
              kept.append(line)
          if removed == 0:
              print("WARNING: 제거할 기존 프리셋 줄을 찾지 못했습니다 (업스트림 구조 변경 가능성)", file=sys.stderr)

          # 2) ui_url 옵션 선언 다음에 나오는 첫 placeholder 줄 뒤에 한국어 프리셋 삽입
          out = []
          inserted = False
          in_ui_url = False
          for line in kept:
              out.append(line)
              if "'ui_url'" in line:
                  in_ui_url = True
                  continue
              if in_ui_url and "o.placeholder" in line and not inserted:
                  indent = re.match(r"^(\s*)", line).group(1)
                  out.append(f"{indent}o.value('{url}', '{label}');\n")
                  inserted = True
                  in_ui_url = False

          if not inserted:
              print("::error::ui_url 옵션 위치를 찾지 못해 한국어 프리셋을 삽입하지 못했습니다.", file=sys.stderr)
              sys.exit(1)

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(out)
          print(f"패치 완료: 기존 프리셋 {removed}줄 제거, 한국어 프리셋 1줄 삽입")
          PYEOF

          # ccache 활성화 (호스트에 ccache가 설치되어 있으면 SDK가 자동으로 감지해 사용한다)
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          make "package/${THEME_PKG}/compile" -j"$(nproc)" V=s 2>&1 | tee ../sdk-build-theme.log
          make "package/${THEME_CONFIG_PKG}/compile" -j"$(nproc)" V=s 2>&1 | tee ../sdk-build-theme-config.log
          make "package/${NIKKI_LUCI_PKG}/compile" -j"$(nproc)" V=s 2>&1 | tee ../sdk-build-nikki-luci.log

          echo "── ccache 통계 ──"
          ccache -s || true

      - name: 컴파일된 커스텀 ipk 수집
        id: theme_ipk
        run: |
          set -euo pipefail
          mkdir -p custom-packages
          find sdk/bin/packages \
            \( -iname "${THEME_PKG}*.ipk" -o -iname "${THEME_CONFIG_PKG}*.ipk" -o -iname "${NIKKI_LUCI_PKG}*.ipk" \) \
            -exec cp -f {} custom-packages/ \;
          ls -la custom-packages/

      # ---------------------------------------------------------------
      # 3) ImageBuilder 단계
      # ---------------------------------------------------------------
      - name: ImageBuilder 다운로드 및 압축 해제
        run: |
          set -euo pipefail
          [ -f imagebuilder.tar.zst ] || curl -fsSL -o imagebuilder.tar.zst "${{ steps.resolve.outputs.ib_url }}"
          mkdir -p imagebuilder
          tar --use-compress-program=unzstd -xf imagebuilder.tar.zst -C imagebuilder --strip-components=1

      - name: 아키텍처 판별 및 로컬/nikki 피드 등록
        id: repo
        run: |
          set -euo pipefail
          cd imagebuilder

          ARCH_PACKAGES=$(grep -oP '(?<=CONFIG_TARGET_ARCH_PACKAGES=")[^"]+' .config)
          echo "arch_packages=${ARCH_PACKAGES}" >> "$GITHUB_OUTPUT"
          echo "판별된 아키텍처: ${ARCH_PACKAGES}"

          NIKKI_BRANCH="openwrt-${BRANCH}"
          NIKKI_FEED_URL="${NIKKI_PAGES}/${NIKKI_BRANCH}/${ARCH_PACKAGES}/nikki"

          mkdir -p custom-packages
          cp -f ../custom-packages/*.ipk custom-packages/ 2>/dev/null || true
          ../ipkg-make-index.sh custom-packages > custom-packages/Packages
          gzip -9nk -f custom-packages/Packages

          # 서명 확인 비활성화: 로컬 커스텀 피드 + 제3자(nikki) 피드를 쓰기 위한 트레이드오프.
          # 필요 시 nikki의 key-build.pub / usign 키를 keys/ 에 추가하고 이 줄을 유지하는 방식으로 강화 가능.
          sed -i '/option check_signature/d' repositories.conf

          {
            echo "src/gz custom file://$(pwd)/custom-packages"
            echo "src/gz nikki ${NIKKI_FEED_URL}"
          } | cat - repositories.conf > repositories.conf.new
          mv repositories.conf.new repositories.conf

          cat repositories.conf

      - name: 한국어 대시보드 다운로드 및 이미지에 내장
        run: |
          set -euo pipefail
          # nikki 기본 UI 경로(external-ui: ui)는 실행 시 /etc/nikki/run/ui 로 해석된다.
          # 부팅 후 사용자가 직접 다운로드 버튼을 누르지 않아도 되도록, 빌드 시점에
          # 미리 받아서 이미지(files 오버레이)에 구워 넣는다.
          UI_DIR=imagebuilder/files/etc/nikki/run/ui
          mkdir -p "${UI_DIR}"

          curl -L --retry 3 --fail -o /tmp/dashboard-ko.zip "${DASHBOARD_KO_URL}"
          rm -rf /tmp/dashboard-ko-extract
          mkdir -p /tmp/dashboard-ko-extract
          unzip -q -o /tmp/dashboard-ko.zip -d /tmp/dashboard-ko-extract

          # 압축 최상위가 폴더 하나뿐이면(예: gh-pages 아카이브 형태) 그 안의 내용물을 사용
          TOP_ENTRIES=$(find /tmp/dashboard-ko-extract -mindepth 1 -maxdepth 1)
          TOP_COUNT=$(echo "${TOP_ENTRIES}" | wc -l)
          if [ "${TOP_COUNT}" -eq 1 ] && [ -d "${TOP_ENTRIES}" ]; then
            cp -a "${TOP_ENTRIES}/." "${UI_DIR}/"
          else
            cp -a /tmp/dashboard-ko-extract/. "${UI_DIR}/"
          fi
          ls -la "${UI_DIR}"

      - name: 부팅시 기본값(uci-defaults) 생성
        run: |
          set -euo pipefail
          mkdir -p imagebuilder/files/etc/uci-defaults
          cat > imagebuilder/files/etc/uci-defaults/99-custom-defaults <<EOF
          #!/bin/sh
          uci set system.@system[0].hostname='${DEVICE_HOSTNAME}'
          uci set system.@system[0].zonename='${DEVICE_TZ}'
          uci set luci.main.lang='${LUCI_LANG}'
          uci set luci.main.mediaurlbase='/luci-static/alpha'
          uci commit system
          uci commit luci

          # nikki UI 프리셋 기본값: 한국어 대시보드
          # (실제 파일은 이미 이미지에 구워져 있으므로, 이 설정은 나중에 사용자가
          #  '다운로드' 버튼을 다시 눌러도 한국어판을 받도록 하는 용도)
          uci -q get nikki.mixin > /dev/null || uci set nikki.mixin=mixin
          uci set nikki.mixin.ui_name='${DASHBOARD_KO_LABEL}'
          uci set nikki.mixin.ui_url='${DASHBOARD_KO_URL}'
          uci commit nikki

          exit 0
          EOF
          chmod +x imagebuilder/files/etc/uci-defaults/99-custom-defaults

      - name: 이미지 빌드
        id: image_build
        run: |
          set -euo pipefail
          cd imagebuilder
          PACKAGES="${THEME_PKG} ${THEME_CONFIG_PKG} luci-i18n-base-${LUCI_LANG} luci-mod-dashboard luci-i18n-dashboard-${LUCI_LANG} nikki luci-app-nikki"
          echo "${PACKAGES}" > ../packages-used.txt
          make image \
            PROFILE="${PROFILE}" \
            PACKAGES="${PACKAGES}" \
            FILES="files" \
            -j"$(nproc)" V=s 2>&1 | tee ../image-build.log
          ls -la bin/targets/*/*/

      # ---------------------------------------------------------------
      # 디버그 번들: config, feeds, repositories.conf, 빌드 로그, 버전정보 등
      # 나중에 "왜 이 빌드가 이렇게 나왔는지" 재현/디버깅하기 위한 전체 스냅샷
      # ---------------------------------------------------------------
      - name: 디버그 정보 번들 생성
        run: |
          set -euo pipefail
          DBG=debug-info
          mkdir -p "${DBG}/sdk" "${DBG}/imagebuilder"

          # 버전/URL 해석 결과
          cat > "${DBG}/resolve-info.txt" <<EOF
          version=${{ steps.resolve.outputs.version }}
          target=${TARGET}
          subtarget=${SUBTARGET}
          profile=${PROFILE}
          branch=${BRANCH}
          arch_packages=${{ steps.repo.outputs.arch_packages }}
          download_base=${{ steps.resolve.outputs.download_base }}
          ib_url=${{ steps.resolve.outputs.ib_url }}
          sdk_url=${{ steps.resolve.outputs.sdk_url }}
          hostname=${DEVICE_HOSTNAME}
          timezone=${DEVICE_TZ}
          luci_lang=${LUCI_LANG}
          EOF

          # SDK 쪽 설정/피드 정보
          cp -f sdk/.config "${DBG}/sdk/.config" 2>/dev/null || true
          cp -f sdk/feeds.conf.default "${DBG}/sdk/feeds.conf.default" 2>/dev/null || true
          cp -f feeds-update.log feeds-install.log feeds-list.log sdk-build-theme.log sdk-build-theme-config.log sdk-build-nikki-luci.log "${DBG}/sdk/" 2>/dev/null || true

          # ImageBuilder 쪽 설정/피드/빌드 정보
          cp -f imagebuilder/.config "${DBG}/imagebuilder/.config" 2>/dev/null || true
          cp -f imagebuilder/repositories.conf "${DBG}/imagebuilder/repositories.conf" 2>/dev/null || true
          cp -rf imagebuilder/files "${DBG}/imagebuilder/files" 2>/dev/null || true
          cp -f imagebuilder/custom-packages/Packages* "${DBG}/imagebuilder/" 2>/dev/null || true
          cp -f packages-used.txt image-build.log "${DBG}/imagebuilder/" 2>/dev/null || true
          find imagebuilder/bin/targets -maxdepth 3 \
            \( -iname "*.manifest" -o -iname "*buildinfo*" -o -iname "profiles.json" -o -iname "sha256sums" \) \
            -exec cp -f {} "${DBG}/imagebuilder/" \; 2>/dev/null || true

          tar -czf debug-info.tar.gz "${DBG}"
          ls -la debug-info.tar.gz

      - name: 산출물 업로드 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ steps.resolve.outputs.version }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.PROFILE }}
          path: |
            imagebuilder/bin/targets/**
            debug-info.tar.gz

      # ---------------------------------------------------------------
      # 4) GitHub Release 자동 생성
      # ---------------------------------------------------------------
      - name: 릴리스 태그 생성
        id: tag
        run: |
          echo "tag=${{ steps.resolve.outputs.version }}-${TARGET}-${SUBTARGET}-${PROFILE}-$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: GitHub Release 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "ImmortalWrt ${{ steps.resolve.outputs.version }} - ${{ env.PROFILE }}"
          body: |
            - Base: ImmortalWrt ${{ steps.resolve.outputs.version }}
            - Target/Subtarget: ${{ env.TARGET }}/${{ env.SUBTARGET }}
            - Profile: ${{ env.PROFILE }}
            - Hostname: ${{ env.DEVICE_HOSTNAME }} / Timezone: ${{ env.DEVICE_TZ }} / LuCI lang: ${{ env.LUCI_LANG }}
            - debug-info.tar.gz 안에 .config / repositories.conf / feeds 로그 / 빌드 로그 / manifest·buildinfo 포함 (디버그용)
          files: |
            imagebuilder/bin/targets/**/*
            debug-info.tar.gz
