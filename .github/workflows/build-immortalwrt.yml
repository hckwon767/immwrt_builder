name: Build ImmortalWrt for orangepi-zero3 (SDK + ImageBuilder, opkg/24.10.6)

on:
  workflow_dispatch:

env:
  TARGET: sunxi
  SUBTARGET: cortexa53
  PROFILE: xunlong_orangepi-zero3
  # 24.10.6 release = opkg 기반 (apk 아님). apk 전환은 25.12부터.
  DOWNLOAD_BASE: https://downloads.immortalwrt.org/releases/24.10.6/targets/sunxi/cortexa53

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: SDK로 커스텀 패키지 컴파일 (bandix, alpha 테마, OpenClash)
  # opkg 방식이므로 OpenClash도 apk 공식 릴리즈 대신 소스에서 직접 빌드
  # ──────────────────────────────────────────────
  build-custom-packages:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swift: true

      - name: Install Build Tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk rsync gettext \
            git libncurses5-dev libssl-dev python3-distutils zlib1g-dev file wget \
            unzip python3-setuptools python3-pyelftools zstd jq

      - name: Resolve & Download SDK
        run: |
          curl -sL "${DOWNLOAD_BASE}/sha256sums" -o sha256sums
          SDK_FILE=$(grep -oE 'immortalwrt-sdk-[^ ]*\.tar\.zst' sha256sums | head -n1)
          echo "SDK_FILE=$SDK_FILE" >> $GITHUB_ENV
          echo "Resolved SDK: $SDK_FILE"
          curl -L --retry 3 --fail "${DOWNLOAD_BASE}/${SDK_FILE}" -o sdk.tar.zst
          mkdir sdk && tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Add Custom Package Sources
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Alpha 테마 + 필수 종속 패키지
          rm -rf package/luci-theme-alpha package/luci-app-alpha-config
          git clone --depth 1 https://github.com/derisamedia/luci-theme-alpha package/luci-theme-alpha
          git clone --depth 1 https://github.com/animegasan/luci-app-alpha-config package/luci-app-alpha-config

          # brand.png 교체 (상단바 + 로그인화면)
          curl -L --retry 3 --fail \
            "https://raw.githubusercontent.com/hckwon767/tuf4200q/refs/heads/main/brand.png" \
            -o /tmp/brand.png
          cp /tmp/brand.png package/luci-theme-alpha/luasrc/brand.png
          cp /tmp/brand.png package/luci-theme-alpha/luasrc/style/brand.png

          # Bandix
          rm -rf package/luci-app-bandix package/openwrt-bandix
          git clone --depth 1 https://github.com/timsaya/luci-app-bandix package/luci-app-bandix
          git clone --depth 1 https://github.com/timsaya/openwrt-bandix package/openwrt-bandix

          # ── OpenClash: opkg 방식으로 전환하면서 공식 apk 릴리즈 다운로드 대신
          #    소스에서 직접 luci-app-openclash를 빌드 (ipk 산출)
          rm -rf package/luci-app-openclash
          git clone --depth 1 https://github.com/vernesong/OpenClash.git /tmp/OpenClash-src
          mkdir -p package/luci-app-openclash
          cp -a /tmp/OpenClash-src/luci-app-openclash/. package/luci-app-openclash/

          # zashboard-ko만 사용하므로, 패키지에 기본 내장된 metacubexd UI는 제거
          rm -rf package/luci-app-openclash/root/usr/share/openclash/ui/metacubexd

      - name: Compile Custom Packages Only (bandix, alpha 테마, openclash)
        run: |
          cd sdk
          make defconfig
          make package/luci-app-bandix/compile V=s -j$(nproc)
          make package/openwrt-bandix/compile V=s -j$(nproc)
          make package/luci-theme-alpha/compile V=s -j$(nproc)
          make package/luci-app-alpha-config/compile V=s -j$(nproc)
          make package/luci-app-openclash/compile V=s -j$(nproc) || \
          make package/luci-app-openclash/compile V=s -j1

      - name: Collect Built Packages
        run: |
          mkdir -p /tmp/custom-packages
          find sdk/bin/packages -type f -name "*.ipk" \
            \( -iname "*bandix*" -o -iname "*alpha*" -o -iname "*openclash*" \) \
            -exec cp -v {} /tmp/custom-packages/ \;
          ls -la /tmp/custom-packages/
          tar -czf custom-packages.tar.gz -C /tmp custom-packages

      - name: Upload Custom Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-packages
          path: custom-packages.tar.gz
          retention-days: 1

  # ──────────────────────────────────────────────
  # JOB 2: ImageBuilder로 최종 이미지 조립
  # ──────────────────────────────────────────────
  build-image:
    needs: build-custom-packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk file wget unzip python3 zstd curl

      - name: Download Custom Packages Artifact
        uses: actions/download-artifact@v4
        with:
          name: custom-packages

      - name: Extract Custom Packages
        run: |
          tar -xzf custom-packages.tar.gz

      - name: Resolve & Download ImageBuilder
        run: |
          curl -sL "${DOWNLOAD_BASE}/sha256sums" -o sha256sums
          IB_FILE=$(grep -oE 'immortalwrt-imagebuilder-[^ ]*\.tar\.zst' sha256sums | head -n1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::ImageBuilder 바이너리를 sha256sums에서 찾을 수 없습니다"
            exit 1
          fi

          echo "IB_FILE=$IB_FILE" >> $GITHUB_ENV
          echo "Resolved ImageBuilder: $IB_FILE"
          curl -L --retry 3 --fail "${DOWNLOAD_BASE}/${IB_FILE}" -o imagebuilder.tar.zst
          mkdir -p imagebuilder && tar --use-compress-program=unzstd -xf imagebuilder.tar.zst -C imagebuilder --strip-components=1

      - name: Register Custom Package Repo
        run: |
          cd imagebuilder

          # opkg 기반 ImageBuilder는 기본적으로 repositories.conf에
          #   src imagebuilder file:packages
          # 항목이 이미 등록되어 있고, ./packages 폴더에 넣은 .ipk는
          # make image 실행 시 자동으로 재인덱싱(Packages/Packages.gz 생성 및
          # 로컬 키로 서명)됩니다. apk 때처럼 별도 mkndx/서명 작업이 필요 없습니다.
          mkdir -p packages
          cp -v ../custom-packages/*.ipk packages/ 2>/dev/null || true

          echo "── repositories.conf ──"
          cat repositories.conf
          echo "── 커스텀 패키지 목록 (packages/) ──"
          ls -la packages/

      - name: Prepare Custom Files Overlay
        run: |
          mkdir -p imagebuilder/files/etc/uci-defaults
          mkdir -p imagebuilder/files/etc/openclash/core

          # UCI 기본값 설정
          cat << 'EOF' > imagebuilder/files/etc/uci-defaults/99-custom
          uci set system.@system[0].hostname='ASUS_VPNBOX'
          uci set luci.main.lang='ko'
          uci set luci.main.mediaurlbase='/luci-static/alpha'
          uci commit luci

          uci set firewall.@defaults[0].flow_offloading='1'
          uci set firewall.@defaults[0].flow_offloading_hw='1'
          uci commit firewall
          exit 0
          EOF
          chmod +x imagebuilder/files/etc/uci-defaults/99-custom

          # OpenClash Smart Core 사전 내장
          curl -L --retry 3 --fail \
            "https://raw.githubusercontent.com/vernesong/OpenClash/core/master/smart/clash-linux-arm64.tar.gz" \
            -o /tmp/clash-arm64.tar.gz
          tar -xzf /tmp/clash-arm64.tar.gz -C /tmp
          cp /tmp/clash imagebuilder/files/etc/openclash/core/clash_meta
          chmod +x imagebuilder/files/etc/openclash/core/clash_meta

          # zashboard 한국어 패치 (metacubexd 대체용 대시보드 UI)
          mkdir -p imagebuilder/files/usr/share/openclash/ui/zashboard
          curl -L --retry 3 --fail \
            "https://github.com/hckwon767/dashboard-ko/releases/download/v3.15.0/zashboard-ko.zip" \
            -o /tmp/zashboard-ko.zip
          unzip -q /tmp/zashboard-ko.zip -d /tmp/dashboard-ko-extract
          cp -a /tmp/dashboard-ko-extract/. imagebuilder/files/usr/share/openclash/ui/zashboard/ 2>/dev/null || true

      - name: Build Image
        run: |
          cd imagebuilder
          make image PROFILE="${PROFILE}" \
            PACKAGES="\
              luci luci-base \
              luci-theme-argon luci-theme-alpha luci-app-alpha-config \
              default-settings-chn \
              luci-i18n-base-ko luci-i18n-firewall-ko luci-i18n-ttyd-ko \
              luci-i18n-hd-idle-ko luci-i18n-upnp-ko luci-i18n-sqm-ko \
              luci-i18n-attendedsysupgrade-ko luci-i18n-dashboard-ko luci-i18n-ddns-ko \
              luci-app-package-manager luci-i18n-package-manager-ko \
              luci-mod-dashboard luci-app-ttyd luci-app-attendedsysupgrade \
              luci-app-upnp luci-app-sqm htop nano irqbalance \
              vsftpd luci-app-ddns ddns-scripts \
              luci-app-openclash kmod-tun ruby ruby-yaml ruby-psych ruby-pstore \
              kmod-inet-diag unzip luci-compat \
              -dnsmasq dnsmasq-full \
              coreutils coreutils-nohup bash curl wget-ssl ca-certificates ca-bundle \
              ipset ip-full iptables iptables-nft iptables-mod-tproxy iptables-mod-extra \
              kmod-ipt-tproxy kmod-nft-tproxy jq jsonfilter \
              lm-sensors collectd-mod-sensors collectd kmod-usb3 kmod-usb-storage \
              kmod-nft-offload \
              luci-app-bandix \
              block-mount automount kmod-fs-ext4 kmod-fs-vfat kmod-fs-exfat \
              kmod-nls-cp437 kmod-nls-utf8 kmod-fs-ntfs3 \
              zram-swap \
              ethtool iperf3 libiperf3 usbutils usbids kmod-usb-printer \
              smartmontools smartmontools-drivedb hd-idle luci-app-hd-idle luci-app-diskman \
            " \
            FILES="files" \
            EXTRA_IMAGE_NAME="ko-custom"

      - name: Prepare Artifacts for Release
        id: organize
        run: |
          cd "imagebuilder/bin/targets/${TARGET}/${SUBTARGET}"
          echo "── 빌드 결과물 전체 목록 ──"
          ls -la

          mkdir -p /tmp/release_files

          # 요청된 3종 이미지 (ext4 / squashfs sdcard + initramfs kernel)
          # xunlong_orangepi-zero3 프로필은 기본적으로 ext4/squashfs 둘 다 빌드됨
          cp -av *ext4-sdcard.img.gz        /tmp/release_files/ 2>/dev/null || echo "::warning::ext4-sdcard.img.gz 없음"
          cp -av *squashfs-sdcard.img.gz    /tmp/release_files/ 2>/dev/null || echo "::warning::squashfs-sdcard.img.gz 없음"
          cp -av *initramfs-kernel.bin      /tmp/release_files/ 2>/dev/null || echo "::warning::initramfs-kernel.bin 없음"

          # manifest / config / feeds 메타데이터
          cp -av *.manifest        /tmp/release_files/ 2>/dev/null || true
          cp -av config.buildinfo  /tmp/release_files/ 2>/dev/null || true
          cp -av feeds.buildinfo   /tmp/release_files/ 2>/dev/null || true
          cp -av version.buildinfo /tmp/release_files/ 2>/dev/null || true
          cp -av sha256sums        /tmp/release_files/ 2>/dev/null || true

          echo "── 릴리즈에 포함될 파일 ──"
          ls -la /tmp/release_files/

          TAG_NAME="ImmortalWrt-orangepi-zero3-$(date +'%Y.%m.%d-%H%M')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_PATH=/tmp/release_files" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ImmortalWrt Release ${{ env.TAG_NAME }}
          files: ${{ steps.organize.outputs.RELEASE_PATH }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
